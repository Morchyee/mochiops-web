# 宿主机 Nginx 配置（不是容器内 nginx.conf）
# 放到服务器: /etc/nginx/sites-available/ops.morchyee.top.conf
# 然后: ln -s /etc/nginx/sites-available/ops.morchyee.top.conf /etc/nginx/sites-enabled/
#       nginx -t && systemctl reload nginx

# HTTP: 用于 Let's Encrypt 验证 + 301 跳转 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name ops.morchyee.top;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: 反向代理到前端容器 (127.0.0.1:8080)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ops.morchyee.top;

    ssl_certificate     /etc/letsencrypt/live/ops.morchyee.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ops.morchyee.top/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
