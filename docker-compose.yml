services:
  web:
    image: ghcr.io/morchyee/mochiops-web:latest
    container_name: mochiops-web
    restart: unless-stopped
    # 只绑定本机回环地址，由宿主机 Nginx 做 443/80 反向代理，避免容器端口直接暴露公网
    ports:
      - '127.0.0.1:8080:80'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
